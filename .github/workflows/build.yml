name: Build Extasis LogDrum (Windows & macOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            artifact_name: ExtasisLogDrum-Windows
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE
          - name: macOS (Universal)
            os: macos-latest
            artifact_name: ExtasisLogDrum-macOS
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DJUCE_COPY_PLUGIN_AFTER_BUILD=FALSE

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC Developer Command Prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: ashley-taylor/setup-ninja@v1.0.0

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" ${{ matrix.cmake_args }}

      - name: Build Plugin & Standalone
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Windows Artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          for path in "build/ExtasisLogDrum_artefacts/VST3/ExtasisLogDrum.vst3" "build/ExtasisLogDrum_artefacts/Release/VST3/ExtasisLogDrum.vst3" "build/ExtasisLogDrum_artefacts/VST3/Extasis LogDrum.vst3" "build/ExtasisLogDrum_artefacts/Release/VST3/Extasis LogDrum.vst3"; do
            if [ -d "$path" ]; then
              cp -r "$path" artifacts/
              break
            fi
          done
          for path in "build/ExtasisLogDrum_artefacts/Standalone/ExtasisLogDrum.exe" "build/ExtasisLogDrum_artefacts/Release/Standalone/ExtasisLogDrum.exe" "build/ExtasisLogDrum_artefacts/Standalone/Extasis LogDrum.exe" "build/ExtasisLogDrum_artefacts/Release/Standalone/Extasis LogDrum.exe"; do
            if [ -f "$path" ]; then
              cp "$path" artifacts/
              break
            fi
          done
          if [ -d "installer" ]; then
            cp -r installer artifacts/
          fi
          for doc in MANUAL.md README.md PRESENTATION.md TECHNICAL.md FICHA_TECNICA.md ARCHITECTURE.md; do
            if [ -f "$doc" ]; then cp "$doc" artifacts/; fi
          done
          

      - name: Prepare macOS Artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts
          for path in "build/ExtasisLogDrum_artefacts/VST3/ExtasisLogDrum.vst3" "build/ExtasisLogDrum_artefacts/Release/VST3/ExtasisLogDrum.vst3" "build/ExtasisLogDrum_artefacts/VST3/Extasis LogDrum.vst3" "build/ExtasisLogDrum_artefacts/Release/VST3/Extasis LogDrum.vst3"; do
            if [ -d "$path" ]; then
              cp -r "$path" artifacts/
              break
            fi
          done
          for path in "build/ExtasisLogDrum_artefacts/AU/ExtasisLogDrum.component" "build/ExtasisLogDrum_artefacts/Release/AU/ExtasisLogDrum.component" "build/ExtasisLogDrum_artefacts/AU/Extasis LogDrum.component" "build/ExtasisLogDrum_artefacts/Release/AU/Extasis LogDrum.component"; do
            if [ -d "$path" ]; then
              cp -r "$path" artifacts/
              break
            fi
          done
          for path in "build/ExtasisLogDrum_artefacts/Standalone/ExtasisLogDrum.app" "build/ExtasisLogDrum_artefacts/Release/Standalone/ExtasisLogDrum.app" "build/ExtasisLogDrum_artefacts/Standalone/Extasis LogDrum.app" "build/ExtasisLogDrum_artefacts/Release/Standalone/Extasis LogDrum.app"; do
            if [ -d "$path" ]; then
              cp -r "$path" artifacts/
              break
            fi
          done
          if [ -d "installer" ]; then
            cp -r installer artifacts/
            chmod +x artifacts/installer/INSTALL_MAC.command 2>/dev/null || true
          fi
          for doc in MANUAL.md README.md PRESENTATION.md TECHNICAL.md FICHA_TECNICA.md ARCHITECTURE.md; do
            if [ -f "$doc" ]; then cp "$doc" artifacts/; fi
          done
          

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/
